name: CI

# Pull requests, and any branch that is not the one deploy.yml handles. A push
# to main runs deploy.yml, which calls the same verify workflow — so a merge
# does not build and test twice.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
