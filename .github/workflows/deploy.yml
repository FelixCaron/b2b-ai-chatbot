name: Multi-Tenant AI Chatbot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Types & Zod Schemas
        run: npm run build --prefix packages/shared

      - name: Build Admin SPA
        run: npm run build --prefix apps/admin

      - name: Build Vanilla JS Widget Bundle
        run: npm run build --prefix apps/widget

      - name: Run Monorepo Integration Tests
        run: node scripts/test-pipeline.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy-vercel-admin:
    name: Deploy Admin SPA to Vercel
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Admin to Vercel Production
        run: vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
        working-directory: apps/admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-vercel-widget:
    name: Deploy Widget CDN to Vercel
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Widget to Vercel Production
        run: vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
        working-directory: apps/widget
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
