<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Preview — Live Assistant</title>
  <style>
    html,body,#frame { height:100%; margin:0; }
    #frame { position:relative; background:#000; }
    iframe { width:100%; height:100%; border:0; display:block; }
    /* The widget will be rendered outside the iframe in this wrapper */
    .preview-banner { position:fixed; top:12px; left:12px; z-index:100001; background:rgba(17,24,39,0.8); color:#fff; padding:8px 12px; border-radius:12px; font-family:Inter,system-ui; font-size:13px; box-shadow:0 6px 18px rgba(2,6,23,0.6);} 
  </style>
</head>
<body>
  <div id="frame">
    <iframe id="preview-iframe" src="" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
  </div>

  <div class="preview-banner">Preview mode — Chatbot overlay from your admin console</div>

  <script>
    function qs(key) {
      const p = new URLSearchParams(window.location.search);
      return p.get(key);
    }
    const domain = qs('domain') || '';
    const tenantKey = qs('tenant_key') || '';
    const apiUrl = qs('api_url') || `${location.origin}/api/chat`;

    // Normalize domain to absolute URL
    const url = (domain.startsWith('http://') || domain.startsWith('https://')) ? domain : `https://${domain}`;
    document.getElementById('preview-iframe').src = url;

    // Inject widget overlay in the wrapper (NOT into iframe)
    // This uses the same script that customers embed on their site.
    (function(){
      const s = document.createElement('script');
      // Load the widget bundle from the same origin — ensure widget.iife.js is available at this path in production
      s.src = `${location.origin.replace(/\/$/, '')}/widget.iife.js`;
      s.defer = true;
      if (tenantKey) s.setAttribute('data-tenant-key', tenantKey);
      if (apiUrl) s.setAttribute('data-api-url', apiUrl);
      // Optional theme color param can be added by passing &theme_color=%23abcd12
      const theme = qs('theme_color');
      if (theme) s.setAttribute('data-theme-color', theme);
      document.body.appendChild(s);
    })();

    // Small protection: warn if preview used without tenant key
    if (!tenantKey) {
      console.warn('[preview] No tenant_key provided; the preview will load default public key.');
    }
  </script>
</body>
</html>
