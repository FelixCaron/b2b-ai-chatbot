<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Assistant Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #0b0f19; color: #f3f4f6; overflow: hidden; }

    /* Top Bar */
    #top-bar {
      height: 52px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10000;
      position: relative;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .domain-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Controls (Center) */
    .viewport-controls {
      display: flex;
      align-items: center;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 3px;
      gap: 2px;
    }
    .vp-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .vp-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    .vp-btn.active {
      background: #6366f1;
      color: #fff;
    }

    /* Actions (Right) */
    .actions-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 11px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Viewport Area */
    #frame-container {
      height: calc(100% - 52px);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07090e;
      position: relative;
      overflow: hidden;
      padding: 0;
      transition: padding 0.2s ease;
    }
    #frame-wrapper {
      height: 100%;
      width: 100%;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      background: #fff;
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      /* CRITICAL: transform isolates 'position: fixed' inside the widget to this wrapper */
      transform: translateZ(0);
    }
    #frame-wrapper.tablet {
      width: 768px;
      height: 92%;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    #frame-wrapper.mobile {
      width: 390px;
      height: 88%;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 4px #1e293b, 0 0 0 5px rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
      transition: opacity 0.3s ease;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.3s ease;
    }
    .spinner {
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* The target container for the widget. Covers the iframe completely, passing pointer events down except for widget contents */
    #b2b-chatbot-injection-target {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; /* Let user interact with the iframe underneath */
      z-index: 10;
    }
    
    /* Ensure widget components capture pointer events */
    #b2b-chatbot-injection-target > div {
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div id="top-bar">
    <div class="brand-section">
      <span class="domain-title" id="site-name">Website Preview</span>
      <span class="status-badge">
        <span class="status-dot"></span> Live Assistant
      </span>
    </div>

    <!-- Viewport Switcher -->
    <div class="viewport-controls">
      <button type="button" class="vp-btn active" onclick="setViewport('desktop', this)">
        🖥️ Desktop
      </button>
      <button type="button" class="vp-btn" onclick="setViewport('tablet', this)">
        📱 Tablet
      </button>
      <button type="button" class="vp-btn" onclick="setViewport('mobile', this)">
        📲 Mobile
      </button>
    </div>

    <!-- Actions -->
    <div class="actions-section">
      <button type="button" class="btn-action" onclick="reloadFrame()" title="Reload preview">
        🔄 Refresh
      </button>
      <a id="external-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-action" title="Open live site in fresh tab">
        ↗ Live Site
      </a>
    </div>
  </div>

  <!-- Viewport Frame -->
  <div id="frame-container">
    <div id="frame-wrapper">
      <div id="loading-overlay">
        <div class="spinner"></div> Checking site security...
      </div>
      <iframe id="preview-iframe" src="" allow="clipboard-read; clipboard-write; microphone"></iframe>
      
      <!-- Widget Injection Target -->
      <div id="b2b-chatbot-injection-target"></div>
    </div>
  </div>

  <script>
    function qs(key) {
      const p = new URLSearchParams(window.location.search);
      return p.get(key);
    }

    const domain = qs('domain') || '';
    const tenantKey = qs('tenant_key') || '';
    const apiUrl = qs('api_url') || `${window.location.origin}/api/chat`;
    const themeColor = qs('theme_color') || '';

    // Normalized direct URL
    const rawTargetUrl = (domain.startsWith('http://') || domain.startsWith('https://')) ? domain : `https://${domain}`;
    
    // Update site name and external link
    document.getElementById('site-name').textContent = domain.replace(/^https?:\/\//, '').replace(/\/$/, '') || 'Website Preview';
    document.getElementById('external-link').href = rawTargetUrl;

    async function loadPreview() {
      const iframe = document.getElementById('preview-iframe');
      const wrapper = document.getElementById('frame-wrapper');
      const loading = document.getElementById('loading-overlay');
      
      if (!domain) {
        iframe.src = 'about:blank';
        loading.style.opacity = '0';
        setTimeout(() => loading.style.display = 'none', 300);
        return;
      }

      loading.style.display = 'flex';
      loading.style.opacity = '1';
      iframe.style.opacity = '0';

      try {
        // Check if the site allows iframing
        const res = await fetch(`${window.location.origin}/api/preview-proxy?url=${encodeURIComponent(rawTargetUrl)}`);
        const data = await res.json();

        if (data.canFrame) {
          // Site allows iframes! Load it natively.
          wrapper.style.backgroundImage = 'none';
          iframe.src = rawTargetUrl;
          iframe.onload = () => {
            iframe.style.opacity = '1';
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 300);
          };
        } else {
          // Site blocks iframes. Use screenshot fallback API (thum.io is free and fast)
          console.log("Site blocks iframes. Using screenshot fallback.");
          iframe.style.display = 'none';
          const screenshotUrl = `https://image.thum.io/get/width/1200/crop/800/${rawTargetUrl}`;
          
          // Preload image
          const img = new Image();
          img.onload = () => {
            wrapper.style.backgroundImage = `url('${screenshotUrl}')`;
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 300);
          };
          img.onerror = () => {
            // If even screenshot fails, just show white background
            wrapper.style.background = '#f8fafc';
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 300);
          };
          img.src = screenshotUrl;
        }
      } catch (e) {
        // Fallback to iframe if check fails
        iframe.src = rawTargetUrl;
        iframe.onload = () => {
          iframe.style.opacity = '1';
          loading.style.opacity = '0';
          setTimeout(() => loading.style.display = 'none', 300);
        };
      }
    }

    function reloadFrame() {
      loadPreview();
    }

    function setViewport(mode, btn) {
      const wrapper = document.getElementById('frame-wrapper');
      document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      wrapper.className = mode === 'desktop' ? '' : mode;
    }

    // Initial frame load
    loadPreview();

    // Inject Chatbot Widget Overlay into the wrapper page
    (function(){
      const s = document.createElement('script');
      s.src = `${window.location.origin.replace(/\/$/, '')}/widget.iife.js`;
      s.defer = true;
      if (tenantKey) s.setAttribute('data-tenant-key', tenantKey);
      if (apiUrl) s.setAttribute('data-api-url', apiUrl);
      if (themeColor) s.setAttribute('data-theme-color', themeColor);
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
